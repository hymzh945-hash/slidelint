[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidelint"
version = "0.1.0"
description = "Find what breaks a deck before the room does: text overflow, off-slide shapes, font sprawl, placeholder copy."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SlideLint" }]
keywords = ["pptx", "powerpoint", "slides", "audit", "design-review", "python-pptx", "presentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = ["python-pptx>=0.6.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
slidelint = "slidelint.cli:main"

[tool.setuptools.packages.find]
include = ["slidelint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
